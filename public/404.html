<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Plotwise - Garden Planner</title>
    <script>
      // GitHub Pages SPA fallback: unknown paths (e.g. /plots on refresh)
      // land here; bounce back into index.html with the route encoded so
      // the app can restore it. pathSegmentsToKeep=1 keeps
      // /Plotwise/.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
